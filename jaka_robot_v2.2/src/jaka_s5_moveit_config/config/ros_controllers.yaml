jaka_s5_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - Joint1
    - Joint2
    - Joint3
    - Joint4
    - Joint5
    - Joint6
  constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 0
      joint_1: {trajectory: 0.1, goal: 0}
      joint_2: {trajectory: 0.1, goal: 0}
      joint_3: {trajectory: 0.1, goal: 0}
      joint_4: {trajectory: 0.1, goal: 0}
      joint_5: {trajectory: 0.1, goal: 0}
      joint_6: {trajectory: 0.1, goal: 0}
  gains:
      Joint1: {p: 100, d: 1, i: 1, i_clamp: 1}
      Joint2: {p: 100, d: 1, i: 1, i_clamp: 1}
      Joint3: {p: 100, d: 1, i: 1, i_clamp: 1}
      Joint4: {p: 100, d: 1, i: 1, i_clamp: 1}
      Joint5: {p: 100, d: 1, i: 1, i_clamp: 1}
      Joint6: {p: 100, d: 1, i: 1, i_clamp: 1}
  stop_trajectory_duration: 0.5
  state_publish_rate:  25
  action_monitor_rate: 1